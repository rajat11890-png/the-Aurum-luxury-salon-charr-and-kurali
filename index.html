    <!-- Environment guard: Suppress benign WebSocket HMR errors in cloud sandbox -->
    <script>
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          String(event.reason?.message || event.reason).includes('WebSocket') ||
          String(event.reason?.message || event.reason).includes('closed without opened')
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message && String(event.message).includes('WebSocket')) {
          event.preventDefault();
        }
      });
    </script>
